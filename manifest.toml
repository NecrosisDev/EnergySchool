[plugin]
name = "Energy School"
version = "0.1.0"
category = "Gameplay"

[script]
runtime = "com.necrosis.script-runtime"
entry = "scripts/main.lua"
requires = ["events.lifecycle", "timers"]
# powers.cast must hand Energy casts the game does not know to Lua (requested, RUNTIME-REQUESTS.md);
# powers.focus pays for them; characters.read and characters.awareness aim Fire Breath; inventory.read
# checks a weapon is in hand; world.lights the gout's flash and the blade's glow; ui.sound the fire.
# levels.serve and assets.read build the Energy page from the installed one (with the requested
# levels.read); effects.fire (the fire jet and flames on the blade) is requested; unknown optional names are ignored
# until a runtime has them. Burning itself is the Fire mod's (com.necrosis.fire), reached by addons.send.
optional = ["powers.cast", "powers.focus", "characters.read", "characters.awareness", "inventory.read",
            "world.lights", "ui.sound", "levels.serve", "assets.read", "effects.fire"]
memory_mb = 64                    # the page merge (merge.lua) holds the icon sheet's mipmaps as pixels

# The Energy page merged in an earlier session (scripts/merge.lua, cached with assets.write), served from the
# game's start; a missing cache is skipped and this session's levels.serve takes over.
[script.overrides]
"Resource.rpk/pwr_energy.pwr" = "cache/pwr_energy.pwr"
"Resource.rpk/thmnrgico1.rfi" = "cache/thmnrgico1.rfi"

[script.modules]
config = "scripts/config.lua"
page = "scripts/page.lua"
merge = "scripts/merge.lua"
